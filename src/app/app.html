<header class="topbar">
  <div class="container topbar__inner">
    <a class="brand" routerLink="/">
      <img src="logo-radiomemory-branca.png" alt="Radio Memory" width="821" height="376" />
      <span class="brand__label">Notícias</span>
    </a>

    <button
      type="button"
      class="theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Ativar modo claro' : 'Ativar modo noturno'"
      [attr.title]="theme.theme() === 'dark' ? 'Modo claro' : 'Modo noturno'"
    >
      @if (theme.theme() === 'dark') {
        <!-- sol -->
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="currentColor" />
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </g>
        </svg>
      } @else {
        <!-- lua -->
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z" />
        </svg>
      }
    </button>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>
